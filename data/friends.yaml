# ============================================================
#  链接页数据（页面标题叫「链接」，文件路径仍叫 friends，是历史原因）
#  增删改只动这一个文件，不需要碰模板
#  条目字段：
#    name   （必填）站点名
#    url    （必填）网址，记得带 https://
#    desc   （可选）一句话简介
#    avatar （可选）头像：/images/friends/xxx.png 或外链；留空则显示名字首字
#  分组字段：
#    name   （必填）分组名，留空则该组不显示标题
#    desc   （可选）分组说明，显示在标题下方
#    items  （必填）该组的条目列表
#  想调整顺序：直接挪动整段，越靠前越早上显示
#
#  可选：在最上面加一段 site:（name/url/desc/avatar），
#  会在页面顶部生成一块「本站信息 · 欢迎取用」，方便别人复制去加你。
#  不加就不显示那块。
# ============================================================

