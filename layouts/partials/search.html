{{- /* 站内搜索浮层：Pagefind 索引由构建时生成，纯静态、无后端 */ -}}
<div class="search-overlay" id="search-overlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="站内搜索">
    <div class="search-head">
      <span class="search-title">站内搜索</span>
      <button type="button" class="search-close" data-search-close aria-label="关闭搜索">Esc</button>
    </div>
    <div class="search-mount" id="search-mount"></div>
    <p class="search-hint" id="search-hint">支持按标题和正文关键词检索。</p>
  </div>
</div>
