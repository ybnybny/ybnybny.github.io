{{- /* 一条短日志 */ -}}
<li class="note" id="{{ .File.ContentBaseName | urlize }}">
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">
    <span class="note-date">{{ .Date.Format "2006-01-02" }}</span>
    <span class="note-time">{{ .Date.Format "15:04" }}</span>
  </time>
  <div class="note-body">{{ .Content }}</div>
</li>
